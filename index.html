
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">

  <title>Timeless Wisdom</title>

  <link rel="stylesheet" href="style.css">

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- StPageFlip -->
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>

<body>

  <header class="topbar">
    <div class="brand">DIGITAL<span>BOOK</span></div>

    <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Toggle fullscreen">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/>
      </svg>
      <span>Fullscreen</span>
    </button>
  </header>

  <main class="main-container">

    <section class="heading">
      <h1>Podcast with Shri Ram</h1>
      <p>Radiant Stars English School, Aligarh</p>
    </section>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loadingText">Preparing your book...</p>
    </div>

    <section class="reader" id="reader" hidden>

      <div class="book-container">
        <div id="book"></div>
      </div>

      <div class="navigation">

        <button id="prevBtn" class="nav-btn" aria-label="Previous page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <div class="page-info" id="pageInfo">
          Page 1
        </div>

        <button id="nextBtn" class="nav-btn" aria-label="Next page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>

      </div>

    </section>

    <div class="error-message" id="errorMessage" hidden>
      Unable to load the book. Please refresh and try again.
    </div>

  </main>

  <footer>
    Made By Anukalp Varshney
  </footer>

  <script src="script.js"></script>

</body>
</html>
